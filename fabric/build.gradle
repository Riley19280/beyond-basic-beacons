plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// GameTests live in their own `gametest` source set (src/gametest) as a separate test mod, so
// none of the test code or test datapack ships in the release jar. `runGameTest` boots a headless
// dedicated server, runs every @GameTest, then exits - and is wired into `check`, so `./gradlew build`
// runs them too.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}_gametest"
        enableGameTests = true
        enableClientGameTests = false
        // The test server won't start without an accepted Minecraft EULA.
        eula = true
    }
}

// The tests themselves are shared with NeoForge (common/src/gametest); this module only adds the
// Fabric registration glue in src/gametest.
sourceSets.named('gametest') {
    java.srcDir(project(':common').file('src/gametest/java'))
    resources.srcDir(project(':common').file('src/gametest/resources'))
}

loom {
    runs {
        named('gameTest') {
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('test-results/gameTest/TEST-gametest.xml').get().asFile}"
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
