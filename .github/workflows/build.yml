name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies (including the decompiled Minecraft/NeoForm artifacts)
      # and validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # `build` runs the unit tests in :common, the Fabric GameTests (a headless test server, via
      # `check` -> `runGameTest`), and compiles/packages the Fabric and NeoForge jars.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            fabric/build/run/gameTest/logs/
          retention-days: 7

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          retention-days: 7
